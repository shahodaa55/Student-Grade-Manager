<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Grade Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <header class="text-center mb-5">
            <h1>Student Grade Manager</h1>
            <p>Manage student academic performance</p>
        </header>

        <section class="card p-4 shadow-sm mb-4">

            <h4 class="mb-4">Student Information</h4>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="nameInput"
                    class="form-control"
                    placeholder="Enter student name">
            </div>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">Math Grade</label>
                    <input type="number" id="mathInput"
                        class="form-control" placeholder="0 - 100">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Programming Grade</label>
                    <input type="number" id="programmingInput"
                        class="form-control" placeholder="0 - 100">
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">English Grade</label>
                    <input type="number" id="englishInput"
                        class="form-control" placeholder="0 - 100">
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Attendance</label>
                <input type="number" id="attendanceInput"
                    class="form-control" placeholder="Attendance percentage">
            </div>

            <div id="errorBox" class="alert alert-danger d-none"></div>

            <button id="saveBtn" class="btn btn-brown w-100 mb-3">
                Register Student
            </button>

            <button id="committeeBtn" class="btn btn-coffee w-100">
                Run Grace Committee
            </button>

        </section>

        <section class="card p-4 shadow-sm mb-4">

            <h4>Registered Students</h4>

            <div id="studentContainer" class="mt-3">
                <p class="text-muted">No students registered yet.</p>
            </div>

        </section>

        <section class="card p-4 shadow-sm">

            <h4>Committee Results</h4>

            <div id="reportBox" class="mt-3">
                <p class="text-muted">The final report will appear here.</p>
            </div>

        </section>

    </div>

    <script src="main.js"></script>

</body>
</html>
